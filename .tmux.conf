#   / ____/ __ \| |    / __ \|  __ \  |  __ \ /\   | |    |  ____|__   __|__   __|  ____|
#  | |   | |  | | |   | |  | | |__) | | |__) /  \  | |    | |__     | |     | |  | |__   
#  | |   | |  | | |   | |  | |  _  /  |  ___/ /\ \ | |    |  __|    | |     | |  |  __|  
#  | |___| |__| | |___| |__| | | \ \  | |  / ____ \| |____| |____   | |     | |  | |____ 
#   \_____\____/|______\____/|_|  \_\ |_| /_/    \_\______|______|  |_|     |_|  |______|
                                                                                                                                                                      
%hidden COLOR_BG="default"  
%hidden COLOR_PRIMARY="#bb9af7"
%hidden COLOR_TEXT_DARK="#15161e"
%hidden COLOR_TEXT_MAIN="#c0caf5"
%hidden COLOR_TEXT_MUTED="#565f89"
%hidden COLOR_ACCENT_WARN="#f7768e"




#    _____ ______ _   _ ______ _____            _         _____ ______ _______ _______ _____ _   _  _____  _____ 
#   / ____|  ____| \ | |  ____|  __ \     /\   | |       / ____|  ____|__   __|__   __|_   _| \ | |/ ____|/ ____|
#  | |  __| |__  |  \| | |__  | |__) |   /  \  | |      | (___ | |__     | |     | |    | | |  \| | |  __| (___  
#  | | |_ |  __| | . ` |  __| |  _  /   / /\ \ | |       \___ \|  __|    | |     | |    | | | . ` | | |_ |\___ \ 
#  | |__| | |____| |\  | |____| | \ \  / ____ \| |____   ____) | |____   | |     | |   _| |_| |\  | |__| |____) |
#   \_____|______|_| \_|______|_|  \_\/_/    \_\______| |_____/|______|  |_|     |_|  |_____|_| \_|\_____|_____/ 
                                                                                                               
set -g allow-passthrough on

# Remap prefix to crtl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse mode off by default
set -g mouse off

# Toggle mouse mode
bind b set -g mouse 

# True color support
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

#  __          _______ _   _ _____   ______          __  _   _     __      __
#  \ \        / /_   _| \ | |  __ \ / __ \ \        / / | \ | |   /\ \    / /
#   \ \  /\  / /  | | |  \| | |  | | |  | \ \  /\  / /  |  \| |  /  \ \  / / 
#    \ \/  \/ /   | | | . ` | |  | | |  | |\ \/  \/ /   | . ` | / /\ \ \/ /  
#     \  /\  /   _| |_| |\  | |__| | |__| | \  /\  /    | |\  |/ ____ \  /   
#      \/  \/   |_____|_| \_|_____/ \____/   \/  \/     |_| \_/_/    \_\/    
                                                                                                    
# Jump directly to tabs 0 through 9 using q, w, e, r, t, y, 1, 2, 3, 4
bind q select-window -t :0
bind w select-window -t :1
bind e select-window -t :2
bind r select-window -t :3
bind t select-window -t :4
bind y select-window -t :5
bind 1 select-window -t :6
bind 2 select-window -t :7
bind 3 select-window -t :8
bind 4 select-window -t :9

# n for previous, m for next    
bind n previous-window
bind m next-window

#   _______ _    _ ______ __  __ ______ 
#  |__   __| |  | |  ____|  \/  |  ____|
#     | |  | |__| | |__  | \  / | |__   
#     | |  |  __  |  __| | |\/| |  __|  
#     | |  | |  | | |____| |  | | |____ 
#     |_|  |_|  |_|______|_|  |_|______|
                                                                        
set -g status-style "bg=#{COLOR_BG} fg=#{COLOR_TEXT_MAIN}"

# Left side
set -g status-left "#[fg=#{COLOR_TEXT_DARK},bg=#{COLOR_PRIMARY},bold] #S #[bg=#{COLOR_BG}] "

# Right side
set -g status-right "#{?mouse,#[fg=#{COLOR_ACCENT_WARN} bold][MOUSE] ,}#[fg=#{COLOR_TEXT_MAIN}] %H:%M #[fg=#{COLOR_PRIMARY}]│#[fg=#{COLOR_TEXT_MAIN}] %d-%b-%y "

# Map window indexes to letters
%hidden TAB_KEY="#{?#{==:#I,0},q,#{?#{==:#I,1},w,#{?#{==:#I,2},e,#{?#{==:#I,3},r,#{?#{==:#I,4},t,#{?#{==:#I,5},y,#{?#{==:#I,6},1,#{?#{==:#I,7},2,#{?#{==:#I,8},3,4}}}}}}}}}"

# Inactive tab layout
setw -g window-status-style "fg=#{COLOR_TEXT_MUTED} bg=#{COLOR_BG}"
setw -g window-status-format " #{?#{==:#I,0},q,#{?#{==:#I,1},w,#{?#{==:#I,2},e,#{?#{==:#I,3},r,#{?#{==:#I,4},t,#{?#{==:#I,5},y,#{?#{==:#I,6},1,#{?#{==:#I,7},2,#{?#{==:#I,8},3,4}}}}}}}}} :#W "

# Active tab layout
setw -g window-status-current-style "fg=#{COLOR_TEXT_DARK} bg=#{COLOR_PRIMARY} bold"
setw -g window-status-current-format " #{?#{==:#I,0},q,#{?#{==:#I,1},w,#{?#{==:#I,2},e,#{?#{==:#I,3},r,#{?#{==:#I,4},t,#{?#{==:#I,5},y,#{?#{==:#I,6},1,#{?#{==:#I,7},2,#{?#{==:#I,8},3,4}}}}}}}}} :#W "

set -g message-style "bg=#{COLOR_PRIMARY} fg=#{COLOR_TEXT_DARK} bold width=100% align=left fill=#{COLOR_PRIMARY}"
set -g message-command-style "bg=#{COLOR_PRIMARY} fg=#{COLOR_TEXT_DARK} bold width=100% align=left fill=#{COLOR_PRIMARY}"